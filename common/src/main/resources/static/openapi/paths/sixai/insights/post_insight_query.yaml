post:
  tags:
    - Insights
  operationId: queryInsights
  summary: Ejecuta una consulta de insights
  description: >
    Con query se ejecuta esa del catálogo (sin IA); con question el modelo elige
    cuál del catálogo responde mejor.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../schemas/request/InsightRequestDto.yaml'
  responses:
    '200':
      description: Resultado del insight
      content:
        application/json:
          schema:
            $ref: '../../../schemas/response/InsightResultDto.yaml'
