openapi: 3.0.1
info:
  title: Swagger new api dev relay
  description: Description of new proyect dev relay
    endpoints declaration
  termsOfService: http://swagger.io/terms/
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
tags:
  - name: dev relay api
    description: All about new api product management
    externalDocs:
      description: Find out more
      url: http://swagger.io
  - name: Jira
    description: Cliente Java para REST API de Jira lectura de issues, comentarios, transiciones de estado y asignación.
      Sin lógica de negocio ni filtrado; eso vive en el micro (back).
  - name: Tasks
    description: Gestión y monitorización de las tareas activas y su estado de ejecución.
  - name: Sessions
    description: Consulta de las sesiones de SixAI y la información asociada a sus pull requests.
  - name: Approvals
    description: Gestión de las aprobaciones de las tareas o incidencias que requieren intervención del usuario.
  - name: Reports
    description: Consulta y acceso al contenido de los informes generados para una incidencia.
  - name: Insights
    description: Consulta de información y métricas mediante el catálogo de insights y ejecución de consultas.
  - name: Chat
    description: Gestión de conversaciones con SixAI, incluyendo el historial y el envío de nuevos mensajes.

servers:
  - url: /api
    description: API base path

paths:
  # =========================
  # JIRA
  # =========================
  /webhooks/jira:
    $ref: "./openapi/paths/webhooks/jira/post_webhooks_jira.yaml"
  # =========================
  # SIXAI
  # =========================
  /sixai/tasks/active:
    $ref: "./openapi/paths/sixai/tasks/tasks.yaml"
  /sixai/tasks/{issueKey}:
    $ref: "./openapi/paths/sixai/tasks/task_by_id.yaml"
  /sixai/sessions:
    $ref: "./openapi/paths/sixai/sessions/list_session.yaml"
  /sixai/issues/{issueKey}/approve:
    $ref: "./openapi/paths/sixai/issues/issue_approval.yaml"
  /sixai/reports:
    $ref: "./openapi/paths/sixai/reports/list_reports.yaml"
  /sixai/reports/{id}/content:
    $ref: "./openapi/paths/sixai/reports/report_content.yaml"
  /sixai/insights/catalog:
    $ref: "./openapi/paths/sixai/insights/list_insights_catalog.yaml"
  /sixai/insights/query:
    $ref: "./openapi/paths/sixai/insights/post_insight_query.yaml"
  /sixai/chat:
    $ref: "./openapi/paths/sixai/chat/chat.yaml"

components:
  securitySchemes:
    webhookSharedSecret:
      type: apiKey
      in: header
      name: X-Maestro-Webhook-Secret
      description: >
        Secreto compartido configurado en maestro.jira.webhook-secret.
        Ver TODO de seguridad en JiraWebhookController: esta validación
        aún no está implementada en el código, solo prevista en el contrato.
  schemas:
    ErrorResponseDto:
      $ref: "./openapi/schemas/common/ErrorResponseDto.yaml"
    JiraSearchResultDto:
      $ref: "./openapi/schemas/response/jira/JiraSearchResultDto.yaml"
    JiraCommentsResultDto:
      $ref: "./openapi/schemas/response/jira/JiraCommentsResultDto.yaml"
    JiraTransitionDto:
      $ref: "./openapi/schemas/response/jira/JiraTransitionDto.yaml"
    JiraTransitionsResultDto:
      $ref: "./openapi/schemas/response/jira/JiraTransitionsResultDto.yaml"
    ActiveTaskDto:
      $ref: "./openapi/schemas/response/ActiveTaskDto.yaml"
    TaskDetailDto:
      $ref: "./openapi/schemas/response/TaskDetailDto.yaml"
    TaskEventDto:
      $ref: "./openapi/schemas/common/TaskEventDto.yaml"
    TaskDeploymentDto:
      $ref: "./openapi/schemas/common/TaskDeploymentDto.yaml"
    TaskPhaseDto:
      $ref: "./openapi/schemas/common/TaskPhaseDto.yaml"
    TaskPhaseEvidenceDto:
      $ref: "./openapi/schemas/common/TaskPhaseEvidenceDto.yaml"
    SixaiSessionDto:
      $ref: "./openapi/schemas/response/SixaiSessionDto.yaml"
    SixaiPrDto:
      $ref: "./openapi/schemas/common/SixaiPrDto.yaml"
    ReportDto:
      $ref: "./openapi/schemas/response/ReportDto.yaml"
    InsightCatalogItemDto:
      $ref: "./openapi/schemas/response/InsightCatalogItemDto.yaml"
    InsightRequestDto:
      $ref: "./openapi/schemas/request/InsightRequestDto.yaml"
    InsightResultDto:
      $ref: "./openapi/schemas/response/InsightResultDto.yaml"
    ChatMessageDto:
      $ref: "./openapi/schemas/response/ChatMessageDto.yaml"
    ChatRequestDto:
      $ref: "./openapi/schemas/request/ChatRequestDto.yaml"
